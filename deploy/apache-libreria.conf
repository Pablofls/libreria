# =============================================================================
# deploy/apache-libreria.conf
# La librería detrás del Apache que comparte la VM con otro proyecto.
#
# POR QUÉ
#   Apache (httpd) ocupa el 80 y el 443 para otro proyecto, que se sirve por
#   NOMBRE (34-51-108-167.sslip.io). La librería se usa por la IP directa
#   (34.51.108.167), así que los dos caben en los mismos puertos como dos
#   VirtualHost distintos. Este archivo sólo añade los de la IP: no toca el
#   otro proyecto.
#
#   Apache termina TLS con el certificado autofirmado de la librería y reenvía
#   TODO a nginx, que ahora escucha sólo en loopback y conserva sus reglas
#   (rutas de la API, portadas, /soap con auth_request, /track/ws):
#       :80  (IP) -> nginx 127.0.0.1:8009  (deploy/nginx-library.conf, monolito /library)
#       :443 (IP) -> nginx 127.0.0.1:8443  (deploy/nginx-api-tls.conf, API)
#
# INSTALACIÓN (el nombre empieza en 01-: debe cargarse ANTES que ssl.conf y que
# el otro proyecto. Un cliente que llega por IP no manda SNI, y Apache le
# responde con el primer VirtualHost *:443 que cargó):
#     sudo cp deploy/apache-libreria.conf /etc/httpd/conf.d/01-libreria.conf
#     sudo apachectl configtest
#     sudo systemctl reload httpd
#
# Requiere mod_ssl, mod_proxy, mod_proxy_http, mod_proxy_wstunnel y
# mod_headers (los mismos que ya usa el otro proyecto) y
#     sudo setsebool -P httpd_can_network_connect 1
# La clave privada vive sólo en la VM, nunca en el repositorio.
# =============================================================================

<VirtualHost *:80>
    ServerName 34.51.108.167
    ServerSignature Off

    ProxyRequests     Off
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8009/
    ProxyPassReverse / http://127.0.0.1:8009/

    ErrorLog  /var/log/httpd/libreria_error.log
    CustomLog /var/log/httpd/libreria_access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName 34.51.108.167
    ServerSignature Off

    SSLEngine on
    SSLCertificateFile    /etc/pki/tls/certs/libreria-api.crt
    SSLCertificateKeyFile /etc/pki/tls/private/libreria-api.key
    SSLProtocol           -all +TLSv1.2 +TLSv1.3

    ProxyRequests     Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    # Rastreo de pedidos (app Java): WebSocket, abierto mientras dura la entrega.
    # La cabecera Authorization pasa tal cual; el JWT lo valida el backend.
    ProxyPass        /track/ws ws://127.0.0.1:8443/track/ws timeout=3600
    ProxyPassReverse /track/ws ws://127.0.0.1:8443/track/ws

    # Todo lo demás de la API, tal cual, a nginx.
    ProxyPass        / http://127.0.0.1:8443/
    ProxyPassReverse / http://127.0.0.1:8443/

    ErrorLog  /var/log/httpd/libreria_api_error.log
    CustomLog /var/log/httpd/libreria_api_access.log combined
</VirtualHost>
