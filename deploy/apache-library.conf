# =============================================================================
# deploy/apache-library.conf
# Alternativa a NGINX, por si en la VM se usa Apache (httpd) en su lugar.
#
#     sudo cp deploy/apache-library.conf /etc/httpd/conf.d/library.conf
#     sudo apachectl configtest
#     sudo systemctl reload httpd
#
# Módulos necesarios: proxy, proxy_http, headers.
#     sudo dnf install -y httpd mod_ssl
#     (en CentOS Stream vienen habilitados en /etc/httpd/conf.modules.d/)
#
# SELinux: por omisión impide que httpd abra conexiones de red salientes, así
# que el proxy hacia Node falla con 503 sin decir por qué. Hay que permitirlo:
#     sudo setsebool -P httpd_can_network_connect 1
# =============================================================================

<VirtualHost *:80>
    ServerName _default_

    ErrorLog  /var/log/httpd/library_error.log
    CustomLog /var/log/httpd/library_access.log combined

    # No anunciar versión ni módulos.
    ServerSignature Off

    LimitRequestBody 3145728   # 3 MB, coherente con UPLOAD_MAX_BYTES

    # --- Archivos subidos: se sirven desde disco, sin pasar por Node ---------
    Alias /library/uploads /opt/udem/libreria/apps/web-monolito/uploads
    <Directory /opt/udem/libreria/apps/web-monolito/uploads>
        Require all granted
        Options -Indexes -ExecCGI -FollowSymLinks
        AllowOverride None
        Header always set X-Content-Type-Options "nosniff"
        Header always set Content-Disposition "inline"
        ExpiresActive On
        ExpiresDefault "access plus 7 days"

        # Nada ejecutable se sirve desde aquí, aunque hubiera burlado la
        # validación de la aplicación.
        <FilesMatch "\.(php|phtml|pl|py|sh|cgi|jsp|asp|exe|js|html?)$">
            Require all denied
        </FilesMatch>
    </Directory>

    # --- Estáticos de la aplicación -----------------------------------------
    Alias /library/css /opt/udem/libreria/apps/web-monolito/public/css
    Alias /library/js  /opt/udem/libreria/apps/web-monolito/public/js
    <Directory /opt/udem/libreria/apps/web-monolito/public>
        Require all granted
        Options -Indexes
        AllowOverride None
    </Directory>

    # --- Aplicación ----------------------------------------------------------
    # Estas rutas ya las atendieron los Alias de arriba; se excluyen del proxy.
    ProxyPass        /library/uploads !
    ProxyPass        /library/css     !
    ProxyPass        /library/js      !

    # Se conserva el prefijo /library en ambos lados: la aplicación lo conoce
    # por BASE_PATH y genera sus enlaces con él.
    ProxyPreserveHost On
    ProxyPass        /library http://127.0.0.1:3000/library retry=0 timeout=60
    ProxyPassReverse /library http://127.0.0.1:3000/library

    RequestHeader set X-Forwarded-Proto "http"
</VirtualHost>
