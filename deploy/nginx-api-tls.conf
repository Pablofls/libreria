# =============================================================================
# deploy/nginx-api-tls.conf
# HTTPS para la API de la libreria: login y los servicios Users, Authors,
# Pedidos y Pagos, detras de nginx. Desde 2026-11-02 el TLS del 443 lo termina
# Apache (deploy/apache-libreria.conf) y nginx escucha en 127.0.0.1:8443.
#
# NO sustituye a nginx-library.conf (el sitio en el 80 sigue como esta). Es un
# segundo archivo que solo escucha en 443.
#
# SIN DOMINIO: Let's Encrypt no emite certificados para una IP, asi que el
# certificado es AUTOFIRMADO, con la IP de la VM como nombre. Cifra igual que
# uno comprado, pero ningun navegador ni curl lo conoce:
#   - curl necesita --cacert <copia del .crt>  (o -k, que NO verifica nada)
#   - un navegador mostrara una advertencia la primera vez.
# Para quitar esas advertencias hace falta un dominio y Let's Encrypt.
#
# Rutas publicas (mismo trazado que cada servicio, sin prefijo):
#   /login /register /logout /session /token/refresh   -> login   (5000)
#   /users                                              -> users   (5003)
#   /authors                                            -> authors (5004)
#   /orders                                             -> pedidos (5005)
#   /payments                                           -> pagos   (5006)
#   /books /concepts                                    -> catalogo (5002)
#   /uploads/<uuid>.png|jpg|webp                        -> portadas (solo imagenes)
#   /metrics/<servicio>                                 -> /metrics (JWT de admin)
#   /track/ws?code=LIB-MTY-...  (WebSocket)             -> gps (5900): rastreo de un
#       pedido para apps/JavaDesktop_app; el JWT lo valida el servicio de pedidos
#   /soap  /wsdl/library-classifier.wsdl                -> soap (5001), SOLO con un
#       JWT valido (auth_request contra pedidos): RegistrarClasificacion no tiene
#       autenticacion propia y no puede quedar abierta a internet
#   /health/<servicio>                                  -> /health de cada uno
#       (login, users, authors, pedidos, pagos, catalogo): son los semaforos
#       de apps/services/soap/cliente/cliente_escritorio.py. El estado de
#       Redis viaja en esa respuesta.
#
# API GATEWAY (2026-11-19): la tabla de rutas del ejercicio, con prefijo /api.
# El gateway quita /api/<nombre> y reenvia a la ruta propia del servicio, asi
# que los servicios no cambian. Las rutas de arriba, sin prefijo, se conservan
# (las usan la app Java, la de Tkinter y tests/pruebas_servicios.py).
#
#   Prefijo        Servicio    Destino                    Acceso (lo rechaza el gateway)
#   /              Monolito    302 -> /library (nginx 8009 -> Node 3000)   publico
#   /api/login     Login       5000 /login, /api/login/{register,logout,
#                              session,token/refresh}     publico, limitado (429)
#   /api/books     Catalogo    5002 /books...             GET publico; escritura con JWT
#   /api/autores   Authors     5004 /authors...           GET publico; escritura con JWT
#   /api/pagos     Pagos       5006 /payments...          JWT
#   /api/pedidos   Pedidos     5005 /orders...            JWT
#   /api/users     Users       5003 /users...             JWT
#
# Los puertos son los reales de la VM, no los de la diapositiva.
# "Rechazar antes": nginx no sabe verificar un JWT, asi que con auth_request se
# lo pregunta a pedidos (GET /orders/books: firma, exp, iss y revocacion en
# Redis). Sin token valido responde el gateway, con 401 y "origen":"gateway",
# sin despertar al servicio. El ROL (403) y la propiedad de los datos los sigue
# decidiendo cada servicio.
#
# En la VM (CentOS Stream 10), cambiando TU_IP por la IP publica de la VM:
#
#     sudo openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
#         -keyout /etc/pki/tls/private/libreria-api.key \
#         -out /etc/pki/tls/certs/libreria-api.crt \
#         -subj "/CN=TU_IP" -addext "subjectAltName=IP:TU_IP"
#     sudo chmod 600 /etc/pki/tls/private/libreria-api.key
#     sudo cp deploy/nginx-api-tls.conf /etc/nginx/conf.d/library-api-tls.conf
#     sudo nginx -t && sudo systemctl reload nginx
#     sudo firewall-cmd --add-port=443/tcp --permanent && sudo firewall-cmd --reload
#
# La clave privada vive solo en la VM, nunca en el repositorio.
# =============================================================================

# --- Gateway: contexto http (conf.d se incluye dentro del bloque http) --------
# Nombres con prefijo gw_ para no chocar con otros archivos de conf.d.
# $request_method dentro de la subpeticion de auth_request es el de la original.
map $request_method $gw_lectura {
    GET     1;
    HEAD    1;
    OPTIONS 1;
    default 0;
}
map $request_method $gw_preflight {
    OPTIONS 1;
    default 0;
}
# Limitador del login en el gateway (el servicio tiene ademas el suyo en Redis).
limit_req_zone $binary_remote_addr zone=gw_login:10m rate=30r/m;

server {
    # Desde 2026-11-02 el 443 de la VM es de Apache (lo comparte otro proyecto):
    # Apache termina TLS con este mismo certificado y reenvía aquí lo que llega
    # por la IP (deploy/apache-libreria.conf). Este bloque ya no ve TLS y sólo
    # escucha en loopback; las reglas de abajo no cambian.
    listen      127.0.0.1:8443;
    server_name _;

    server_tokens off;
    client_max_body_size 1m;

    access_log /var/log/nginx/library-api.access.log;
    error_log  /var/log/nginx/library-api.error.log warn;

    # Cabeceras comunes. Authorization pasa tal cual: el JWT lo verifica cada
    # servicio, no nginx. Que no se registre en el access_log: el formato por
    # omision de nginx no incluye cabeceras, y asi debe seguir.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;   # el cliente llegó por TLS a Apache
    proxy_connect_timeout 10s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    add_header X-Content-Type-Options "nosniff" always;

    # Todo llega desde Apache (127.0.0.1): la IP real del cliente viene en
    # X-Forwarded-For. Sin esto el limitador de /api/login veria a todos como
    # uno solo, y X-Real-IP diria 127.0.0.1 a los servicios.
    set_real_ip_from 127.0.0.1;
    real_ip_header   X-Forwarded-For;

    # Un id por peticion, en la respuesta y hacia el servicio, para cruzar logs.
    # Ningun location define add_header propio: si lo hiciera, dejaria de
    # heredar estos dos.
    proxy_set_header X-Request-ID $request_id;
    add_header X-Request-ID $request_id always;

    # Redirecciones relativas: nginx no ve TLS ni el puerto publico, y una
    # absoluta saldria como http://...:8443.
    absolute_redirect off;

    # =========================================================================
    # API GATEWAY: /  y  /api/*
    # =========================================================================

    # "/" es el sistema web publico (el monolito vive bajo /library).
    location = / {
        return 302 /library/;
    }
    # El monolito se reenvia al nginx del sitio (8009), que ya sirve las
    # imagenes y el CSS desde disco y pasa lo demas a Node (3000).
    location ^~ /library {
        client_max_body_size 3m;          # subida de portadas (2 MB en la app)
        proxy_buffering off;              # paginas con sesion
        proxy_read_timeout 60s;
        proxy_pass http://127.0.0.1:8009;
    }

    location ^~ /api/ {
        # Respuestas del propio gateway, en JSON. Solo atrapa los errores que
        # genera nginx (proxy_intercept_errors sigue apagado): un 401 o 403 de
        # un servicio llega intacto.
        error_page 401     = @gw_401;
        error_page 404     = @gw_404;
        error_page 429     = @gw_429;
        error_page 500     = @gw_503;   # auth_request: pedidos no pudo decidir
        error_page 502 504 = @gw_502;   # servicio caido o lento

        # --- Login: publico, con limitador ---------------------------------
        location = /api/login {
            limit_req zone=gw_login burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://127.0.0.1:5000/login;
        }
        location ~ ^/api/login/(register|logout|session|token/refresh)$ {
            limit_req zone=gw_login burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://127.0.0.1:5000/$1$is_args$args;
        }

        # --- Libros y autores: GET publico, escritura con JWT --------------
        location = /api/books {
            auth_request /_gw_jwt_escritura;
            proxy_pass http://127.0.0.1:5002/books;
        }
        location ^~ /api/books/ {
            auth_request /_gw_jwt_escritura;
            proxy_pass http://127.0.0.1:5002/books/;
        }
        location = /api/autores {
            auth_request /_gw_jwt_escritura;
            proxy_pass http://127.0.0.1:5004/authors;
        }
        location ^~ /api/autores/ {
            auth_request /_gw_jwt_escritura;
            proxy_pass http://127.0.0.1:5004/authors/;
        }

        # --- Pagos, pedidos y usuarios: JWT siempre ------------------------
        location = /api/pagos {
            auth_request /_gw_jwt;
            proxy_pass http://127.0.0.1:5006/payments;
        }
        location ^~ /api/pagos/ {
            auth_request /_gw_jwt;
            proxy_pass http://127.0.0.1:5006/payments/;
        }
        location = /api/pedidos {
            auth_request /_gw_jwt;
            proxy_pass http://127.0.0.1:5005/orders;
        }
        location ^~ /api/pedidos/ {
            auth_request /_gw_jwt;
            proxy_pass http://127.0.0.1:5005/orders/;
        }
        location = /api/users {
            auth_request /_gw_jwt;
            proxy_pass http://127.0.0.1:5003/users;
        }
        location ^~ /api/users/ {
            auth_request /_gw_jwt;
            proxy_pass http://127.0.0.1:5003/users/;
        }

        # Cualquier otra cosa bajo /api/ no existe.
        return 404;
    }

    # Comprobacion de JWT del gateway (subpeticiones internas). Pedidos responde
    # 200 con token valido y no revocado, 401 si no; un 503 (Redis caido) llega
    # aqui como 500 y se contesta 503: falla CERRADA, como los servicios.
    location = /_gw_jwt {
        internal;
        if ($gw_preflight) { return 204; }   # el preflight CORS no lleva token
        proxy_pass http://127.0.0.1:5005/orders/books;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
    }
    location = /_gw_jwt_escritura {
        internal;
        if ($gw_lectura) { return 204; }     # GET/HEAD/OPTIONS son publicos
        proxy_pass http://127.0.0.1:5005/orders/books;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
    }

    location @gw_401 {
        default_type application/json;
        return 401 '{"error": "Token ausente, invalido o revocado", "origen": "gateway"}\n';
    }
    location @gw_404 {
        default_type application/json;
        return 404 '{"error": "Ruta no encontrada", "origen": "gateway"}\n';
    }
    location @gw_429 {
        default_type application/json;
        return 429 '{"error": "Demasiadas peticiones, intenta en un momento", "origen": "gateway"}\n';
    }
    location @gw_502 {
        default_type application/json;
        return 502 '{"error": "Servicio no disponible", "origen": "gateway"}\n';
    }
    location @gw_503 {
        default_type application/json;
        return 503 '{"error": "No se pudo verificar el token", "origen": "gateway"}\n';
    }

    # =========================================================================
    # Rutas sin prefijo (anteriores al gateway; se conservan)
    # =========================================================================

    # `proxy_pass` sin URI en una location con regex reenvia la ruta original.
    location ~ ^/(login|register|logout|session|token)(/|$) {
        proxy_pass http://127.0.0.1:5000;
    }
    location ~ ^/users(/|$) {
        proxy_pass http://127.0.0.1:5003;
    }
    location ~ ^/authors(/|$) {
        proxy_pass http://127.0.0.1:5004;
    }
    location ~ ^/orders(/|$) {
        proxy_pass http://127.0.0.1:5005;
    }
    location ~ ^/payments(/|$) {
        proxy_pass http://127.0.0.1:5006;
    }

    location ~ ^/(books|concepts)(/|$) {
        proxy_pass http://127.0.0.1:5002;
    }

    # Rastreo de entregas por WebSocket. Upgrade/Connection convierten la
    # peticion HTTP en WebSocket; el timeout largo deja abierta la conexion
    # mientras dura la entrega (el servidor manda un mensaje por segundo).
    location = /track/ws {
        proxy_pass http://127.0.0.1:5900;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Servicio SOAP (integracion demostrativa de la app Java). nginx no sabe
    # verificar un JWT, asi que se lo pregunta a pedidos: GET /orders/books
    # exige token valido y no revocado. 2xx deja pasar; 401 se devuelve tal cual.
    location = /soap {
        auth_request /_jwt_valido;
        proxy_pass http://127.0.0.1:5001;
    }
    location = /wsdl/library-classifier.wsdl {
        auth_request /_jwt_valido;
        proxy_pass http://127.0.0.1:5001;
    }
    location = /_jwt_valido {
        internal;
        proxy_pass http://127.0.0.1:5005/orders/books;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
    }

    # Portadas de los libros, para la app de escritorio. Solo imagenes con el
    # nombre que genera el servidor (uuid + extension): cualquier otra cosa
    # cae en el 404 de abajo. Son las mismas que sirve el sitio del puerto 80.
    # La regex va ENTRE COMILLAS: sin ellas nginx toma las llaves de {36} por un bloque.
    location ~* "^/uploads/([0-9a-f-]{36}\.(png|jpe?g|webp))$" {
        alias /opt/udem/libreria/apps/web-monolito/uploads/$1;
        expires 1d;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=86400";
    }

    # Semaforos: solo /health, nada mas de cada servicio. La query string
    # (?format=json en login y catalogo) se conserva.
    location = /health/login    { proxy_pass http://127.0.0.1:5000/health; }
    location = /health/catalogo { proxy_pass http://127.0.0.1:5002/health; }
    location = /health/users    { proxy_pass http://127.0.0.1:5003/health; }
    location = /health/authors  { proxy_pass http://127.0.0.1:5004/health; }
    location = /health/pedidos  { proxy_pass http://127.0.0.1:5005/health; }
    location = /health/pagos    { proxy_pass http://127.0.0.1:5006/health; }

    # Metricas (cada servicio exige JWT de admin): /metrics/<servicio>.
    location = /metrics/login    { proxy_pass http://127.0.0.1:5000/metrics; }
    location = /metrics/catalogo { proxy_pass http://127.0.0.1:5002/metrics; }
    location = /metrics/users    { proxy_pass http://127.0.0.1:5003/metrics; }
    location = /metrics/authors  { proxy_pass http://127.0.0.1:5004/metrics; }
    location = /metrics/pedidos  { proxy_pass http://127.0.0.1:5005/metrics; }
    location = /metrics/pagos    { proxy_pass http://127.0.0.1:5006/metrics; }

    # Nada mas se publica por aqui.
    location / {
        return 404;
    }
}
