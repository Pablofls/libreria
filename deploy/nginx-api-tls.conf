# =============================================================================
# deploy/nginx-api-tls.conf
# HTTPS para la API de la libreria: login y los servicios Users, Authors,
# Pedidos y Pagos, detras de nginx en el puerto 443.
#
# NO sustituye a nginx-library.conf (el sitio en el 80 sigue como esta). Es un
# segundo archivo que solo escucha en 443.
#
# SIN DOMINIO: Let's Encrypt no emite certificados para una IP, asi que el
# certificado es AUTOFIRMADO, con la IP de la VM como nombre. Cifra igual que
# uno comprado, pero ningun navegador ni curl lo conoce:
#   - curl necesita --cacert <copia del .crt>  (o -k, que NO verifica nada)
#   - un navegador mostrara una advertencia la primera vez.
# Para quitar esas advertencias hace falta un dominio y Let's Encrypt.
#
# Rutas publicas (mismo trazado que cada servicio, sin prefijo):
#   /login /register /logout /session /token/refresh   -> login   (5000)
#   /users                                              -> users   (5003)
#   /authors                                            -> authors (5004)
#   /orders                                             -> pedidos (5005)
#   /payments                                           -> pagos   (5006)
#   /books /concepts                                    -> catalogo (5002)
#   /uploads/<uuid>.png|jpg|webp                        -> portadas (solo imagenes)
#   /metrics/<servicio>                                 -> /metrics (JWT de admin)
#   /health/<servicio>                                  -> /health de cada uno
#       (login, users, authors, pedidos, pagos, catalogo): son los semaforos
#       de apps/services/soap/cliente/cliente_escritorio.py. El estado de
#       Redis viaja en esa respuesta.
#
# En la VM (CentOS Stream 10), cambiando TU_IP por la IP publica de la VM:
#
#     sudo openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
#         -keyout /etc/pki/tls/private/libreria-api.key \
#         -out /etc/pki/tls/certs/libreria-api.crt \
#         -subj "/CN=TU_IP" -addext "subjectAltName=IP:TU_IP"
#     sudo chmod 600 /etc/pki/tls/private/libreria-api.key
#     sudo cp deploy/nginx-api-tls.conf /etc/nginx/conf.d/library-api-tls.conf
#     sudo nginx -t && sudo systemctl reload nginx
#     sudo firewall-cmd --add-port=443/tcp --permanent && sudo firewall-cmd --reload
#
# La clave privada vive solo en la VM, nunca en el repositorio.
# =============================================================================

server {
    listen      443 ssl;
    server_name _;

    ssl_certificate     /etc/pki/tls/certs/libreria-api.crt;
    ssl_certificate_key /etc/pki/tls/private/libreria-api.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:5m;
    ssl_session_timeout 10m;

    server_tokens off;
    client_max_body_size 1m;

    access_log /var/log/nginx/library-api.access.log;
    error_log  /var/log/nginx/library-api.error.log warn;

    # Cabeceras comunes. Authorization pasa tal cual: el JWT lo verifica cada
    # servicio, no nginx. Que no se registre en el access_log: el formato por
    # omision de nginx no incluye cabeceras, y asi debe seguir.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    add_header X-Content-Type-Options "nosniff" always;

    # `proxy_pass` sin URI en una location con regex reenvia la ruta original.
    location ~ ^/(login|register|logout|session|token)(/|$) {
        proxy_pass http://127.0.0.1:5000;
    }
    location ~ ^/users(/|$) {
        proxy_pass http://127.0.0.1:5003;
    }
    location ~ ^/authors(/|$) {
        proxy_pass http://127.0.0.1:5004;
    }
    location ~ ^/orders(/|$) {
        proxy_pass http://127.0.0.1:5005;
    }
    location ~ ^/payments(/|$) {
        proxy_pass http://127.0.0.1:5006;
    }

    location ~ ^/(books|concepts)(/|$) {
        proxy_pass http://127.0.0.1:5002;
    }

    # Portadas de los libros, para la app de escritorio. Solo imagenes con el
    # nombre que genera el servidor (uuid + extension): cualquier otra cosa
    # cae en el 404 de abajo. Son las mismas que sirve el sitio del puerto 80.
    # La regex va ENTRE COMILLAS: sin ellas nginx toma las llaves de {36} por un bloque.
    location ~* "^/uploads/([0-9a-f-]{36}\.(png|jpe?g|webp))$" {
        alias /opt/udem/libreria/apps/web-monolito/uploads/$1;
        expires 1d;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=86400";
    }

    # Semaforos: solo /health, nada mas de cada servicio. La query string
    # (?format=json en login y catalogo) se conserva.
    location = /health/login    { proxy_pass http://127.0.0.1:5000/health; }
    location = /health/catalogo { proxy_pass http://127.0.0.1:5002/health; }
    location = /health/users    { proxy_pass http://127.0.0.1:5003/health; }
    location = /health/authors  { proxy_pass http://127.0.0.1:5004/health; }
    location = /health/pedidos  { proxy_pass http://127.0.0.1:5005/health; }
    location = /health/pagos    { proxy_pass http://127.0.0.1:5006/health; }

    # Metricas (cada servicio exige JWT de admin): /metrics/<servicio>.
    location = /metrics/login    { proxy_pass http://127.0.0.1:5000/metrics; }
    location = /metrics/catalogo { proxy_pass http://127.0.0.1:5002/metrics; }
    location = /metrics/users    { proxy_pass http://127.0.0.1:5003/metrics; }
    location = /metrics/authors  { proxy_pass http://127.0.0.1:5004/metrics; }
    location = /metrics/pedidos  { proxy_pass http://127.0.0.1:5005/metrics; }
    location = /metrics/pagos    { proxy_pass http://127.0.0.1:5006/metrics; }

    # Nada mas se publica por aqui.
    location / {
        return 404;
    }
}
