# =============================================================================
# deploy/nginx-library.conf
# Publica la aplicación bajo /library y la reenvía a Node en 127.0.0.1:3000.
#
# En la VM (CentOS Stream 10):
#     sudo cp deploy/nginx-library.conf /etc/nginx/conf.d/library.conf
#     sudo nginx -t          # valida la sintaxis antes de recargar
#     sudo systemctl reload nginx
#
# Qué hace el reverse proxy dentro de la arquitectura:
#   1. Es lo único expuesto a internet. Node escucha en loopback, así que ni
#      abriendo el puerto 3000 en el firewall de GCP se llegaría a él.
#   2. Termina TLS. Node nunca ve certificados ni claves privadas.
#   3. Sirve /library/uploads y /library/css directamente desde disco, sin
#      despertar al proceso de Node para cada imagen.
#   4. Permite cambiar de puerto, reiniciar o desplegar una versión nueva de la
#      aplicación sin tocar la URL pública.
# =============================================================================

server {
    # `default_server` es necesario: se accede por IP, sin nombre de dominio, y
    # sin esta marca NGINX entregaría la petición al bloque `server` que trae
    # /etc/nginx/nginx.conf por omisión, que muestra su página de bienvenida.
    # Sólo puede haber UN default_server por puerto, así que el bloque de
    # ejemplo de nginx.conf debe quedar comentado (ver la nota al final).
    listen      80 default_server;
    server_name _;

    # Tamaño máximo del cuerpo. Debe ser >= UPLOAD_MAX_BYTES (2 MB) pero no
    # mucho más: es la primera barrera contra una subida enorme, y rechaza
    # aquí, antes de que el archivo llegue a Node.
    client_max_body_size 3m;

    # No anunciar la versión de NGINX en las respuestas ni en las páginas de error.
    server_tokens off;

    access_log /var/log/nginx/library.access.log;
    error_log  /var/log/nginx/library.error.log warn;

    # --- Archivos subidos --------------------------------------------------
    # Se sirven desde disco, sin pasar por Node.
    # Las tres directivas de seguridad son necesarias juntas: nosniff impide que
    # el navegador interprete como HTML un archivo con contenido inesperado,
    # Content-Disposition fuerza que se muestre en vez de ejecutarse, y la
    # negación de extensiones ejecutables cierra el caso de un archivo que
    # hubiera burlado la validación de la aplicación.
    location /library/uploads/ {
        alias /opt/udem/libreria/apps/web-monolito/uploads/;
        expires 7d;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Disposition "inline" always;
        add_header Cache-Control "public, max-age=604800";

        # Cinturón y tirantes: nada ejecutable se sirve desde aquí, pase lo que pase.
        location ~* \.(php|phtml|pl|py|sh|cgi|jsp|asp|aspx|exe|js|html?)$ {
            deny all;
        }
    }

    # --- Estáticos de la aplicación ----------------------------------------
    location /library/css/ {
        alias /opt/udem/libreria/apps/web-monolito/public/css/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
    location /library/js/ {
        alias /opt/udem/libreria/apps/web-monolito/public/js/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # --- Aplicación ---------------------------------------------------------
    # Se conserva el prefijo /library al reenviar (proxy_pass SIN barra final):
    # la aplicación conoce su prefijo por BASE_PATH y genera sus enlaces con él,
    # así que el proxy no necesita reescribir nada. Si se quitara el prefijo
    # aquí, los redirects de Express apuntarían a la raíz y romperían.
    location /library {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Sin estas cabeceras, la aplicación vería 127.0.0.1 como IP de todos
        # los clientes: el limitador de intentos de login bloquearía a todos
        # a la vez, y la cookie `secure` no se enviaría bajo HTTPS.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # No cachear páginas con sesión.
        proxy_buffering off;
    }

    # Nada más se publica desde este servidor.
    location / {
        return 404;
    }
}

# -----------------------------------------------------------------------------
# ANTES DE RECARGAR: comentar el bloque `server` de ejemplo que trae
# /etc/nginx/nginx.conf, o NGINX se negará a arrancar con
# "duplicate default server for 0.0.0.0:80". Es el bloque que empieza con
#     server {
#         listen       80;
#         listen       [::]:80;
#         server_name  _;
#         root         /usr/share/nginx/html;
# y termina en su llave de cierre, incluidos los bloques `error_page`.
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# Cuando haya certificado (Let's Encrypt u otro), el bloque 80 pasa a redirigir
# y el contenido se sirve desde 443. Al activarlo hay que poner COOKIE_SECURE=true
# en el .env, o la cookie de sesión seguirá viajando sin la marca `secure`.
#
# server {
#     listen 443 ssl http2;
#     server_name ejemplo.udem.edu;
#     ssl_certificate     /etc/letsencrypt/live/ejemplo/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/ejemplo/privkey.pem;
#     ssl_protocols TLSv1.2 TLSv1.3;
#     add_header Strict-Transport-Security "max-age=31536000" always;
#     ... mismos bloques location ...
# }
# server { listen 80; server_name ejemplo.udem.edu; return 301 https://$host$request_uri; }
# -----------------------------------------------------------------------------
