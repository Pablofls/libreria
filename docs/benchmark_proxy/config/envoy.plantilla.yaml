# Envoy bajo prueba. generar.py sustituye __JWK_K__ y escribe generado/envoy.yaml.
#   8080  proxy inverso hacia b1
#   8081  balanceador round robin con chequeo activo, outlier detection y reintento
#   8082  API gateway: jwt_authn (HS256) + local_ratelimit
static_resources:
  listeners:
  - name: proxy_inverso
    address: { socket_address: { address: 0.0.0.0, port_value: 8080 } }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: rp
          route_config:
            virtual_hosts:
            - name: rp
              domains: ["*"]
              routes:
              - match: { prefix: "/" }
                route: { cluster: uno }
          http_filters:
          - name: envoy.filters.http.router
            typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router }

  - name: balanceador
    address: { socket_address: { address: 0.0.0.0, port_value: 8081 } }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: lb
          route_config:
            virtual_hosts:
            - name: lb
              domains: ["*"]
              routes:
              - match: { prefix: "/" }
                route:
                  cluster: todos
                  retry_policy:
                    retry_on: "connect-failure,reset,refused-stream,5xx"
                    num_retries: 2
          http_filters:
          - name: envoy.filters.http.router
            typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router }

  - name: gateway
    address: { socket_address: { address: 0.0.0.0, port_value: 8082 } }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: gw
          route_config:
            virtual_hosts:
            - name: gw
              domains: ["*"]
              routes:
              - match: { prefix: "/limitado" }
                route: { cluster: uno }
                typed_per_filter_config:
                  envoy.filters.http.local_ratelimit:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                    stat_prefix: rl_limitado
                    token_bucket: { max_tokens: 10, tokens_per_fill: 10, fill_interval: 1s }
                    filter_enabled:  { default_value: { numerator: 100, denominator: HUNDRED } }
                    filter_enforced: { default_value: { numerator: 100, denominator: HUNDRED } }
              - match: { prefix: "/" }
                route: { cluster: uno }
          http_filters:
          - name: envoy.filters.http.jwt_authn
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
              providers:
                login:
                  issuer: login-libreria
                  forward: true
                  local_jwks:
                    inline_string: '{"keys":[{"kty":"oct","alg":"HS256","k":"__JWK_K__"}]}'
              rules:
              - match: { prefix: "/" }
                requires: { provider_name: login }
          - name: envoy.filters.http.local_ratelimit
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
              stat_prefix: rl
              token_bucket: { max_tokens: 100000, tokens_per_fill: 100000, fill_interval: 1s }
              filter_enabled:  { default_value: { numerator: 100, denominator: HUNDRED } }
              filter_enforced: { default_value: { numerator: 100, denominator: HUNDRED } }
          - name: envoy.filters.http.router
            typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router }

  clusters:
  - name: uno
    type: STATIC
    connect_timeout: 1s
    load_assignment:
      cluster_name: uno
      endpoints:
      - lb_endpoints:
        - endpoint: { address: { socket_address: { address: 172.28.0.11, port_value: 80 } } }

  - name: todos
    type: STATIC
    connect_timeout: 1s
    lb_policy: ROUND_ROBIN
    health_checks:
    - timeout: 0.5s
      interval: 1s
      unhealthy_threshold: 2
      healthy_threshold: 2
      http_health_check: { path: /health }
    outlier_detection:
      consecutive_5xx: 3
      consecutive_gateway_failure: 2
      base_ejection_time: 5s
    load_assignment:
      cluster_name: todos
      endpoints:
      - lb_endpoints:
        - endpoint: { address: { socket_address: { address: 172.28.0.11, port_value: 80 } } }
        - endpoint: { address: { socket_address: { address: 172.28.0.12, port_value: 80 } } }
        - endpoint: { address: { socket_address: { address: 172.28.0.13, port_value: 80 } } }
