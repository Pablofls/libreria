# HAProxy bajo prueba.
#   80  proxy inverso hacia b1
#   81  balanceador round robin con chequeo activo cada 1 s y reintento
global
    maxconn 20000
    nbthread 1

defaults
    mode http
    timeout connect 1s
    timeout client  30s
    timeout server  30s
    option http-keep-alive
    retries 2
    option redispatch

frontend proxy_inverso
    bind :80
    default_backend uno

frontend balanceador
    bind :81
    default_backend todos

backend uno
    http-reuse safe
    server b1 172.28.0.11:80

backend todos
    balance roundrobin
    http-reuse safe
    option httpchk GET /health
    default-server check inter 1s fall 2 rise 2
    server b1 172.28.0.11:80
    server b2 172.28.0.12:80
    server b3 172.28.0.13:80
