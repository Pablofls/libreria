# Apache httpd bajo prueba.
#   80  proxy inverso hacia b1
#   81  cadena Apache -> nginx -> b1: la topología real de la VM desde 2026-11-02
#       (deploy/apache-libreria.conf reenvía a nginx en loopback)
ServerRoot "/usr/local/apache2"
Listen 80
Listen 81

LoadModule mpm_event_module   modules/mod_mpm_event.so
LoadModule authz_core_module  modules/mod_authz_core.so
LoadModule unixd_module       modules/mod_unixd.so
LoadModule log_config_module  modules/mod_log_config.so
LoadModule proxy_module       modules/mod_proxy.so
LoadModule proxy_http_module  modules/mod_proxy_http.so

User daemon
Group daemon
ServerName bench
ServerSignature Off
ServerTokens Prod
ErrorLog /proc/self/fd/2
LogLevel warn
KeepAlive On
MaxKeepAliveRequests 0

<IfModule mpm_event_module>
    StartServers          2
    ServerLimit           4
    ThreadsPerChild      64
    MaxRequestWorkers   256
</IfModule>

<VirtualHost *:80>
    ProxyRequests     Off
    ProxyPreserveHost On
    ProxyPass        / http://172.28.0.11:80/
    ProxyPassReverse / http://172.28.0.11:80/
</VirtualHost>

<VirtualHost *:81>
    ProxyRequests     Off
    ProxyPreserveHost On
    ProxyPass        / http://172.28.0.20:80/
    ProxyPassReverse / http://172.28.0.20:80/
</VirtualHost>
