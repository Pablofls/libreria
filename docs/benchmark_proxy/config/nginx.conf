# nginx bajo prueba. Un puerto por papel:
#   80  proxy inverso hacia b1, con keepalive al upstream (recomendado)
#   84  proxy inverso hacia b1 SIN keepalive: así está hoy deploy/nginx-api-tls.conf
#   81  balanceador round robin b1, b2, b3 con reintento y salida pasiva
#   82  API gateway: auth_request contra el validador Python + limit_req
#   83  igual que 82 pero cacheando 30 s la respuesta del validador
worker_processes 1;
events { worker_connections 4096; }

http {
    access_log off;
    error_log /dev/stderr warn;
    server_tokens off;

    upstream uno {
        server 172.28.0.11:80;
        keepalive 64;
    }
    upstream todos {
        server 172.28.0.11:80 max_fails=1 fail_timeout=5s;
        server 172.28.0.12:80 max_fails=1 fail_timeout=5s;
        server 172.28.0.13:80 max_fails=1 fail_timeout=5s;
        keepalive 64;
    }
    upstream validador {
        server 172.28.0.30:9000;
        keepalive 32;
    }

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 1s;
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 3;

    limit_req_zone $binary_remote_addr zone=gw:10m  rate=100000r/s;
    limit_req_zone $binary_remote_addr zone=lim:1m  rate=10r/s;
    limit_req_status 429;

    proxy_cache_path /tmp/cache_auth levels=1 keys_zone=auth:1m max_size=10m inactive=60s;

    server {
        listen 80;
        location / { proxy_pass http://uno; }
    }

    server {
        listen 84;
        # Réplica de la VM: proxy_pass a una dirección, sin bloque upstream ni
        # keepalive. nginx abre una conexión TCP nueva al backend por petición.
        location / {
            proxy_set_header Connection close;
            proxy_pass http://172.28.0.11:80;
        }
    }

    server {
        listen 81;
        location / { proxy_pass http://todos; }
    }

    server {
        listen 82;
        location / {
            auth_request /_auth;
            limit_req zone=gw burst=2000 nodelay;
            proxy_pass http://uno;
        }
        location /limitado {
            auth_request /_auth;
            limit_req zone=lim burst=10 nodelay;
            proxy_pass http://uno;
        }
        location = /_auth {
            internal;
            proxy_pass http://validador/verificar;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
        }
    }

    server {
        listen 83;
        location / {
            auth_request /_auth;
            limit_req zone=gw burst=2000 nodelay;
            proxy_pass http://uno;
        }
        location = /_auth {
            internal;
            proxy_pass http://validador/verificar;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
            # Sólo se cachea el "sí" (204), nunca un 401. Coste: un token
            # revocado sigue valiendo hasta 30 s más.
            proxy_cache auth;
            proxy_cache_key $http_authorization;
            proxy_cache_valid 204 30s;
            proxy_ignore_headers Cache-Control Expires Set-Cookie;
        }
    }
}
