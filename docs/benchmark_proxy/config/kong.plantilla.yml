# Kong (DB-less) bajo prueba. generar.py sustituye __SECRETO__ y escribe
# generado/kong.yml. Puerto 8000: API gateway con jwt (HS256) + rate-limiting.
_format_version: "3.0"

services:
  - name: b1
    url: http://172.28.0.11:80
    routes:
      - name: todo
        paths: ["/"]
        strip_path: false
        plugins:
          - name: rate-limiting
            config: { second: 100000, policy: local }
      - name: limitado
        paths: ["/limitado"]
        strip_path: false
        plugins:
          - name: rate-limiting
            config: { second: 10, policy: local }

plugins:
  - name: jwt
    config:
      key_claim_name: iss
      claims_to_verify: [exp]

consumers:
  - username: login-libreria
    jwt_secrets:
      - key: login-libreria
        algorithm: HS256
        secret: "__SECRETO__"
